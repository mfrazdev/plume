name: Build Plume Standalone

on:
  push:
    branches:
      - master
      - canary

permissions:
  contents: write

jobs:
  versioning:
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.calc_version.outputs.TAG_NAME }}
      IS_LATEST: ${{ steps.calc_version.outputs.IS_LATEST }}
      IS_CANARY: ${{ steps.calc_version.outputs.IS_CANARY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: calc_version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --quiet
          
          LATEST_STABLE=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          if [ -z "$LATEST_STABLE" ]; then
            BASE_TAG="0.0.1"
            HAS_STABLE=false
          else
            BASE_TAG="$LATEST_STABLE"
            HAS_STABLE=true
          fi
          
          IFS='.' read -r -a VERSION_PARTS <<< "$BASE_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            FINAL_TAG="${BASH_REMATCH[1]}"
            IS_LATEST="true"
            IS_CANARY="false"
          elif [[ "$BRANCH_NAME" == "canary" ]]; then
            FINAL_TAG="$MAJOR.$MINOR.$PATCH-canary"
            IS_CANARY="true"
            if [ "$HAS_STABLE" = false ]; then IS_LATEST="true"; else IS_LATEST="false"; fi
          else
            if [ "$HAS_STABLE" = true ]; then PATCH=$((PATCH + 1)); fi
            FINAL_TAG="$MAJOR.$MINOR.$PATCH"
            IS_LATEST="true"
            IS_CANARY="false"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_OUTPUT
          echo "IS_CANARY=$IS_CANARY" >> $GITHUB_OUTPUT

  build:
    needs: versioning
    strategy:
      # A Mágica do ARM64 acontece AQUI!
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-13
            name: macos-x64 # macos-13 usa processador Intel
          - os: macos-latest
            name: macos-arm64 # macos-latest usa os novos Apple Silicon (M1)

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make gradlew executable (Linux/Mac)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Build Native Standalone
        # O jpackage vai ler o sistema da matrix e compilar certo pra ele!
        run: ./gradlew packageNative --no-daemon

      - name: Rename Executables for Release
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            mv **/builds/**/Plume-Standalone.exe Plume-${{ matrix.name }}.exe
          else
            mv **/builds/**/Plume-Standalone Plume-${{ matrix.name }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plume-${{ matrix.name }}
          path: |
            Plume-${{ matrix.name }}.exe
            Plume-${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: [versioning, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Force Update Canary Tag
        if: ${{ needs.versioning.outputs.IS_CANARY == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ needs.versioning.outputs.TAG_NAME }}
          git push -f origin ${{ needs.versioning.outputs.TAG_NAME }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.versioning.outputs.TAG_NAME }}
          files: |
            ./artifacts/Plume-windows-x64.exe
            ./artifacts/Plume-linux-x64
            ./artifacts/Plume-macos-x64
            ./artifacts/Plume-macos-arm64
          generate_release_notes: true
          make_latest: ${{ needs.versioning.outputs.IS_LATEST == 'true' }}
          prerelease: ${{ needs.versioning.outputs.IS_CANARY == 'true' }}