name: Build PlumeSFTP (Rust + C# NativeAOT)

on:
  push:
    branches:
      - master
      - canary

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. JOB DE VERSIONAMENTO (Igual ao seu)
  # ==========================================
  versioning:
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}
      IS_LATEST: ${{ steps.version.outputs.IS_LATEST }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --quiet
          
          LATEST_STABLE=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          if [ -z "$LATEST_STABLE" ]; then
            BASE_TAG="0.0.1"
            HAS_STABLE=false
          else
            BASE_TAG="$LATEST_STABLE"
            HAS_STABLE=true
          fi
          
          IFS='.' read -r -a VERSION_PARTS <<< "$BASE_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            FINAL_TAG="${BASH_REMATCH[1]}"
            IS_LATEST="true"
          elif [[ "$BRANCH_NAME" == "canary" ]]; then
            FINAL_TAG="$MAJOR.$MINOR.$PATCH-canary"
            if [ "$HAS_STABLE" = false ]; then IS_LATEST="true"; else IS_LATEST="false"; fi
          else
            if [ "$HAS_STABLE" = true ]; then PATCH=$((PATCH + 1)); fi
            FINAL_TAG="$MAJOR.$MINOR.$PATCH"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_OUTPUT

      # Atualiza a tag Canary no repositório, se aplicável
      - name: Force Update Canary Tag
        if: contains(steps.version.outputs.TAG_NAME, 'canary')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version.outputs.TAG_NAME }}
          git push -f origin ${{ steps.version.outputs.TAG_NAME }}

  # ==========================================
  # 2. JOB DE COMPILAÇÃO (Matriz Multi-OS)
  # ==========================================
  build:
    needs: versioning
    # Matriz para compilar cada alvo na sua máquina nativa correspondente
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            distro: windows-amd64
            rid: win-x64
          - os: ubuntu-latest
            distro: linux-amd64
            rid: linux-x64
          - os: ubuntu-latest
            distro: linux-arm64
            rid: linux-arm64
          - os: ubuntu-latest
            distro: alpine-amd64
            rid: linux-musl-x64
          - os: macos-14 # Mac M1/M2 nativo (ARM64)
            distro: mac-arm64
            rid: osx-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Versão baseada no seu .csproj

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Instala dependências no Linux para compilar C# NativeAOT e C++ Linker
      - name: Install Linux NativeAOT Prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # clang e zlib são obrigatórios para NativeAOT
          sudo apt-get install -y clang zlib1g-dev
          # Toolchains para cross-compilar ARM64 e Musl (Alpine) a partir do Ubuntu x64
          if [[ "${{ matrix.distro }}" == "linux-arm64" ]]; then sudo apt-get install -y gcc-aarch64-linux-gnu; fi
          if [[ "${{ matrix.distro }}" == "alpine-amd64" ]]; then sudo apt-get install -y musl-tools; fi

      # Roda o seu script Node.js na pasta PlumeSFTP
      - name: Build Rust and C# (using build.js)
        working-directory: ./PlumeSFTP
        run: node build.js --distro=${{ matrix.distro }} --all

      # Zipa o resultado final do .NET NativeAOT (ignorando os .pdb)
      - name: Pack Binary
        shell: bash
        run: |
          # O caminho onde o NativeAOT joga os arquivos publicados
          PUBLISH_DIR="./app/bin/Release/net10.0/${{ matrix.rid }}/publish"
          
          # Compacta a pasta num ZIP (Ex: plumesftp-linux-x64.zip)
          cd $PUBLISH_DIR
          zip -r ../../../../../../plumesftp-${{ matrix.rid }}.zip * -x "*.pdb"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: plumesftp-${{ matrix.rid }}.zip
          retention-days: 1

  # ==========================================
  # 3. JOB DE LANÇAMENTO (Release no GitHub)
  # ==========================================
  release:
    needs: [versioning, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.TAG_NAME }}
          name: v${{ needs.versioning.outputs.TAG_NAME }}
          files: artifacts/*.zip
          generate_release_notes: true
          make_latest: ${{ needs.versioning.outputs.IS_LATEST }}
          prerelease: ${{ contains(needs.versioning.outputs.TAG_NAME, 'canary') }}