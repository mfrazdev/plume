name: Build PlumeSFTP (Rust + C# NativeAOT)

on:
  push:
    branches:
      - master
      - canary

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. JOB DE VERSIONAMENTO
  # ==========================================
  versioning:
    runs-on: ubuntu-latest
    outputs:
      TAG_NAME: ${{ steps.version.outputs.TAG_NAME }}
      IS_LATEST: ${{ steps.version.outputs.IS_LATEST }}
      BUILD_TIME: ${{ steps.version.outputs.BUILD_TIME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git fetch --tags --quiet
          
          LATEST_STABLE=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)
          
          if [ -z "$LATEST_STABLE" ]; then
            BASE_TAG="0.0.1"
            HAS_STABLE=false
          else
            BASE_TAG="$LATEST_STABLE"
            HAS_STABLE=true
          fi
          
          IFS='.' read -r -a VERSION_PARTS <<< "$BASE_TAG"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"
          
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          BUILD_TIME=$(date +%s)
          
          if [[ "$COMMIT_MSG" =~ release\ v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            FINAL_TAG="${BASH_REMATCH[1]}"
            IS_LATEST="true"
          elif [[ "$BRANCH_NAME" == "canary" ]]; then
            FINAL_TAG="$MAJOR.$MINOR.$PATCH-canary"
            if [ "$HAS_STABLE" = false ]; then IS_LATEST="true"; else IS_LATEST="false"; fi
          else
            if [ "$HAS_STABLE" = true ]; then PATCH=$((PATCH + 1)); fi
            FINAL_TAG="$MAJOR.$MINOR.$PATCH"
            IS_LATEST="true"
          fi
          
          echo "TAG_NAME=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "IS_LATEST=$IS_LATEST" >> $GITHUB_OUTPUT
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_OUTPUT

      - name: Force Update Canary Tag
        if: contains(steps.version.outputs.TAG_NAME, 'canary')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f ${{ steps.version.outputs.TAG_NAME }}
          git push -f origin ${{ steps.version.outputs.TAG_NAME }}

  # ==========================================
  # 2. JOB DE COMPILAÇÃO (Matriz Multi-OS sem ZIP)
  # ==========================================
  build:
    needs: versioning
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            distro: linux-amd64
            rid: linux-x64
            final_name: plume-linux-amd64
          - os: ubuntu-latest
            distro: linux-arm64
            rid: linux-arm64
            final_name: plume-linux-arm64
          - os: ubuntu-latest
            distro: alpine-amd64
            rid: linux-musl-x64
            final_name: plume-linux-musl-amd64
          - os: macos-14
            distro: mac-arm64
            rid: osx-arm64
            final_name: plume-darwin-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup .NET 10.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux NativeAOT Prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
          if [[ "${{ matrix.distro }}" == "linux-arm64" ]]; then sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu; fi
          if [[ "${{ matrix.distro }}" == "alpine-amd64" ]]; then sudo apt-get install -y musl-tools; fi

      - name: Cache SFTP Binaries
        id: cache-sftp
        uses: actions/cache@v4
        with:
          path: ./bin/sftp
          key: sftp-${{ matrix.rid }}-${{ hashFiles('sftp/**') }}
          restore-keys: |
            sftp-${{ matrix.rid }}-

      - name: Build Rust and C#
        shell: bash
        env:
          TAG_NAME: ${{ needs.versioning.outputs.TAG_NAME }}
          BUILD_TIME: ${{ needs.versioning.outputs.BUILD_TIME }}
        run: |
          if [ "${{ steps.cache-sftp.outputs.cache-hit }}" == "true" ]; then
            echo "Cache dos binários do SFTP encontrado! Pulando o build completo..."
            node build.js --distro=${{ matrix.distro }} --csharp
          else
            echo "Nenhum cache válido encontrado (ou o código Rust mudou). Buildando tudo..."
            node build.js --distro=${{ matrix.distro }} --all
          fi

      - name: Extract Raw Executable
        shell: bash
        run: |
          PUBLISH_DIR="./bin/app/Release/publish"
          
          # Entra no diretório de publicação e remove os arquivos indesejados (.pdb de debug)
          cd $PUBLISH_DIR
          rm -f *.pdb *.dbg *.dsym
          
          # Pega o único arquivo que sobrar, que é nosso executável NativeAOT cru
          BIN_FILE="plume-${{ matrix.rid }}"
          
          if [ -z "$BIN_FILE" ]; then
            echo "Erro: Nenhum executável final encontrado no diretório $PUBLISH_DIR!"
            exit 1
          fi
          
          # Move e renomeia para a raiz para o Upload
          mv "$BIN_FILE" "../../../../${{ matrix.final_name }}"

      - name: Upload Raw Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.rid }}
          path: ${{ matrix.final_name }}
          retention-days: 1

  # ==========================================
  # 3. JOB DE LANÇAMENTO (Release no GitHub e Limpeza)
  # ==========================================
  release:
    needs: [versioning, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.TAG_NAME }}
          name: v${{ needs.versioning.outputs.TAG_NAME }}
          files: artifacts/*
          generate_release_notes: true
          make_latest: ${{ needs.versioning.outputs.IS_LATEST }}
          prerelease: ${{ contains(needs.versioning.outputs.TAG_NAME, 'canary') }}

      - name: Delete Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          failOnError: false
          all: true